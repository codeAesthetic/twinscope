# Packaging (MVP-12). Kept declarative — the build itself is `npm run build`.
#
# There is no native module to rebuild: history uses Node's built-in
# `node:sqlite` (D9a), which is why `npmRebuild` can stay off and the packaged
# app has nothing to compile on a user's machine.
appId: com.twinscope.desktop
productName: TwinScope
copyright: © 2026 codeAesthetic

directories:
  output: release
  buildResources: build

# An allowlist, not an ignore list: anything not named here cannot end up in the
# bundle by accident. `out/` is the electron-vite build.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # pdfjs (v0.3.3) ships a whole web viewer, two builds, image decoders, cmaps and
  # standard fonts. The engine worker imports exactly one file — the legacy build —
  # and never renders, so the rest is 20 MB of an installer with a 130 MB budget.
  # cmaps and standard fonts are only reachable through `cMapUrl`/`standardFontDataUrl`,
  # which this app deliberately does not set: see engine-worker/pdfHost.ts.
  - '!node_modules/pdfjs-dist/{build,web,image_decoders,cmaps,standard_fonts,wasm,types}/**'
  - '!node_modules/pdfjs-dist/legacy/{web,image_decoders}/**'
  - '!node_modules/pdfjs-dist/**/*.min.mjs'

asar: true
npmRebuild: false

# `twinscope://` (v0.2.12). `app.setAsDefaultProtocolClient` in `main/protocol.ts` is
# enough for a dev run, and only for a dev run: on macOS LaunchServices resolves a
# scheme from `CFBundleURLTypes` in the bundle's Info.plist, and on Windows the
# installer writes the registry association. Without this entry a *packaged* app
# claims nothing, so every `twinscope://compare?...` link — including the ones the VS
# Code extension emits and the one at the bottom of every exported HTML report — opens
# nothing at all.
protocols:
  - name: TwinScope comparison
    schemes:
      - twinscope

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Hardened runtime is required for notarisation; signing itself is an owner
  # action (see docs/release.md) and is skipped when no identity is present.
  hardenedRuntime: true
  gatekeeperAssess: false
  darkModeSupport: true

dmg:
  title: TwinScope ${version}

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  category: Development
  # Required for the .deb target — it sets the package maintainer field. Same
  # identity as every commit; the noreply address keeps a real inbox out of a
  # published package.
  maintainer: codeAesthetic <34807924+codeAesthetic@users.noreply.github.com>
  target:
    - AppImage
    - deb

# Still null, and not an oversight now that v0.2.13 exists. This field configures
# the feed `electron-updater` would download from, and the app deliberately has no
# updater: it asks the GitHub API for the latest release *number* from main, then
# opens the release page. An unsigned build cannot verify an update, so there is
# nothing here to point at — see `src/main/update.ts`.
publish: null
