name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Electron's binary is only needed by `npm run verify`, which needs a
      # display. This job checks source only, so skip the ~300 MB download.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build:
    name: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # Boot the real app and assert the security posture holds. Electron needs
      # a window server, which macOS runners provide and ubuntu ones do not.
      - name: Verify the app boots
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verification-screenshots
          path: e2e/.artifacts/screenshots/
          if-no-files-found: ignore

  package:
    name: package (macOS)
    # Only on main: a dmg per pull request is 116 MB of artifact nobody reads.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Unsigned: signing needs a Developer ID certificate, which is an owner
      # action (docs/release.md). The point here is that packaging still works.
      - name: Build the macOS package
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test the packaged app
        run: npm run verify:packaged

      - uses: actions/upload-artifact@v5
        with:
          name: twinscope-macos
          path: release/*.dmg
          if-no-files-found: error
