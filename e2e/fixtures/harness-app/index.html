<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DevDiff harness fixture</title>
    <style>
      :root {
        --bg: #07090c;
        --panel: #0e1116;
        --line: #1e2530;
        --tx: #e7ebf2;
        --tx-2: #98a2b3;
        --acc: #7c6cff;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--tx);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 12px;
        padding: 22px 26px;
        text-align: center;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      p {
        color: var(--tx-2);
        margin: 0 0 14px;
      }
      button {
        border: 1px solid transparent;
        background: var(--acc);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 7px;
        cursor: pointer;
      }
      #state {
        margin-top: 12px;
        color: var(--tx-2);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 data-testid="fixture-title">Playwright harness fixture</h1>
      <p>Proves the harness can boot Electron, read the DOM and click things.</p>
      <button data-testid="ping">Ping</button>
      <div id="state" data-testid="state">idle</div>
    </div>
    <script>
      document.querySelector('[data-testid="ping"]').addEventListener('click', () => {
        document.querySelector('[data-testid="state"]').textContent = 'pong';
      });
    </script>
  </body>
</html>
